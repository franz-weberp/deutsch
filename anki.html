<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">

  <title>Diário Deutsch — Revisão</title>
  <style>
    :root { color-scheme: dark; --bg:#101113; --surface:#191b20; --line:#30333a; --ink:#f1f2f4; --muted:#a9adb7; --accent:#90d6ae; --danger:#f09a9a; --player:#77baff; --space-1:4px; --space-2:8px; --space-3:16px; --space-4:24px; --space-5:32px; --space-6:48px; --space-7:64px; }

    .card { min-height:360px; padding:24px; }
    .card-top { display:flex; align-items:center; justify-content:flex-start; gap:16px; }

    .audio-controls { align-items:center; }
    #audio-play { width:44px; height:44px; padding:0; border-radius:50%; color:var(--accent); border-color:rgba(144,214,174,.55); }

    .deck-list { display:grid; gap:8px; margin:0 0 16px; }

    .deck-option { display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left; }

    .study-card { display:flex; flex-direction:column; min-height:0; overflow:hidden; border:1px solid var(--line); border-radius:24px; background:linear-gradient(145deg,#20242c,#16181c); box-shadow:0 20px 50px rgba(0,0,0,.25); touch-action:pan-y; user-select:none; }
    .study-card.swipe-left { animation:out-left .25s ease both; } .study-card.swipe-right { animation:out-right .25s ease both; }
    .study-main { display:flex; flex:0 1 auto; flex-direction:column; min-height:200px; height:auto; padding:24px; }

    .study-footer { display:grid; gap:0; padding:16px 24px 24px; border-top:1px solid var(--line); background:rgba(9,10,13,.18); }

    .transport { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; min-height:50px; }

    .study-card #audio-play { width:50px; height:50px; flex:0 0 50px; font-size:1.1rem; border-radius:50%; }
    .audio-meta { display:grid; gap:16px; margin:16px 0 0; }
    .audio-meta-head { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:start; gap:24px; }

    .audio-caption > span { display:block; }
    .audio-caption .sync-state, .audio-caption a { color:var(--accent); }

    .audio-meta .resync-feedback button { display:grid; place-items:center; width:36px; height:36px; padding:0; border:0; border-radius:0; color:var(--muted); background:transparent; }
    .audio-meta .resync-feedback button + button { border-left:1px solid var(--line); }
    .audio-meta .resync-feedback button.active { color:var(--accent); background:rgba(144,214,174,.08); }
    .audio-meta .resync-feedback button.adjust.active { color:#f0c078; background:rgba(240,192,120,.08); }
    .audio-meta .resync-feedback button.adjust.needs-analysis { color:#f0c078; border-left-color:rgba(240,192,120,.5); background:rgba(240,192,120,.08); }
    .audio-meta .resync-feedback svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; stroke-width:1.9; }
    .audio-meta .resync-hints { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) 32px 40px; grid-template-rows:32px 56px 0; align-items:center; justify-content:space-between; column-gap:0; row-gap:0; min-height:120px; overflow:hidden; padding:16px; border-top:1px solid var(--line); border-radius:12px; background:rgba(25,27,32,.7); transition:grid-template-rows .3s cubic-bezier(.2,.75,.25,1), min-height .3s cubic-bezier(.2,.75,.25,1); }

    .study-card .resync-hint { grid-template-columns:58px minmax(0,1fr); gap:8px; }

    .adjust-control button { width:32px; height:32px; padding:0; border-radius:50%; }

    .resync-unknown, .resync-save { display:grid; place-items:center; width:32px; height:32px; padding:0; border-radius:50%; line-height:0; }
    .resync-unknown { grid-column:3; color:#f0c078; border-color:rgba(240,192,120,.55); background:rgba(240,192,120,.06); }
    .resync-unknown.active { color:#f5cf8d; border-color:rgba(240,192,120,.9); background:rgba(240,192,120,.14); }
    .resync-save { grid-column:4; margin-left:8px; color:var(--muted); }

    .resync-save.pending { color:var(--accent); border-color:rgba(144,214,174,.65); background:rgba(144,214,174,.08); }
    .clip-waveform { --clip-start:18%; --clip-end:82%; position:relative; align-self:end; grid-column:1 / -1; grid-row:2; height:40px; overflow:hidden; border-radius:8px; background:linear-gradient(90deg,rgba(255,255,255,.015),rgba(255,255,255,.035),rgba(255,255,255,.015)); }
    .clip-waveform svg { position:absolute; inset:0; width:100%; height:100%; }

    .clip-waveform .wave-fill rect { fill:var(--accent); }
    .clip-waveform::before, .clip-waveform::after { content:''; position:absolute; z-index:2; top:5px; bottom:5px; width:1px; background:rgba(144,214,174,.9); box-shadow:0 0 8px rgba(144,214,174,.4); transition:left .14s ease-out; }

    .resync-confirm { display:flex; align-self:end; grid-column:1 / -1; grid-row:3; align-items:center; justify-content:space-between; gap:16px; width:100%; height:72px; margin:0; padding:16px; overflow:hidden; border:1px solid var(--line); border-radius:8px; background:rgba(16,17,19,.56); opacity:1; transform:translateY(0); transition:height .3s cubic-bezier(.2,.75,.25,1), padding .3s cubic-bezier(.2,.75,.25,1), border-width .3s cubic-bezier(.2,.75,.25,1), opacity .2s ease .1s, transform .3s cubic-bezier(.2,.75,.25,1); }

    .resync-confirm-actions button { padding:8px 16px; font-size:.8125rem; }

    .resync-toast { position:relative; width:100%; overflow:hidden; padding:16px; border:1px solid rgba(144,214,174,.5); border-radius:12px; background:#1a2420; box-shadow:0 20px 32px rgba(0,0,0,.32); color:var(--ink); font-size:.84rem; animation:toast-in .18s ease-out both; }

    .study-card .actions { display:flex; align-items:center; justify-content:center; gap:48px; margin:0; padding-top:16px; border-top:0; }

    body.is-reviewing .step { display:none; }
    .study-card .actions button { display:inline-grid; place-items:center; width:52px; height:52px; padding:0; border-radius:50%; line-height:0; }
    .study-card .actions svg { display:block; width:21px; height:21px; fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; stroke-width:2; }
    .study-card .actions .again { color:var(--danger); border-color:rgba(240,154,154,.65); }

    .study-card .actions .known { color:var(--accent); border-color:rgba(144,214,174,.65); background:rgba(144,214,174,.06); }
    @media (max-width:420px) { main { padding:32px 16px; } .study-main { padding:24px; } .study-footer { padding:16px; } .audio-meta .resync-hints { grid-template-columns:minmax(0,1fr) 28px 36px; grid-template-rows:28px 28px 48px 0; min-height:120px; padding:8px; } .audio-meta .resync-hints.has-confirmation { grid-template-rows:28px 28px 48px 104px; min-height:224px; } .study-card .resync-hint { grid-column:1; grid-template-columns:58px minmax(0,1fr); gap:4px; } .study-card .resync-hint:nth-of-type(1) { grid-row:1; } .study-card .resync-hint:nth-of-type(2) { grid-row:2; } .study-card .resync-hint + .resync-hint { margin-left:0; padding-left:0; border-left:0; border-top:0; padding-top:0; } .adjust-control { grid-template-columns:28px 58px 28px; gap:4px; } .adjust-control button, .resync-unknown, .resync-save { width:28px; height:28px; } .adjust-value { width:58px; height:28px; font-size:.72rem; } .resync-unknown { grid-column:2; grid-row:1 / span 2; align-self:center; justify-self:start; } .resync-save { grid-column:3; grid-row:1 / span 2; align-self:center; justify-self:end; margin-left:8px; } .clip-waveform { grid-row:3; height:32px; } .resync-confirm { grid-row:4; gap:8px; padding:8px; } .resync-confirm p { font-size:.875rem; } .resync-confirm-actions { gap:4px; } .resync-confirm-actions button { padding:8px; } .resync-toasts { right:16px; bottom:16px; } }

  </style>

<body>
  <main>
    <header>
      <div><p class="step" id="step-label">01 · Importação</p></div>
      <div class="tools">
        <button class="icon-control" id="settings-toggle" hidden aria-label="Configurações" aria-expanded="false"><svg class="settings-gear" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.43 12.98c.04-.32.07-.65.07-.98s-.02-.66-.07-.98l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.6-.22l-2.49 1a7.1 7.1 0 0 0-1.69-.98L14.5 2.42A.5.5 0 0 0 14 2h-4a.5.5 0 0 0-.5.42l-.38 2.65c-.61.25-1.18.58-1.69.98l-2.49-1a.5.5 0 0 0-.6.22l-2 3.46a.5.5 0 0 0 .12.64l2.11 1.65c-.05.32-.08.65-.08.98s.03.66.08.98l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46a.5.5 0 0 0 .6.22l2.49-1c.51.4 1.08.73 1.69.98l.38 2.65A.5.5 0 0 0 10 22h4a.5.5 0 0 0 .5-.42l.38-2.65c.61-.25 1.18-.58 1.69-.98l2.49 1a.5.5 0 0 0 .6-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.65ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"></path></svg></button>
        <section class="settings" id="settings-panel" hidden>

          <div class="settings-row"><span>Repetir áudio</span><button class="icon-control" id="audio-loop" aria-pressed="false" title="Repetir áudio">↻</button></div>

    </header>
    <p id="deck-status">Escolha uma pasta ou importe seu <code>anki.md</code> para começar.</p>
    <section class="import-stage" id="import-stage">
      <div class="import-card"><h2>01 · Importação</h2><p>Selecione um baralho para começar a revisão.</p><div class="import-actions">
        <label class="file-label primary" for="deck-file">Importar anki.md</label><input id="deck-file" type="file" accept=".md,text/markdown,text/plain">

  <script>

      const settingsToggle = document.querySelector('#settings-toggle');

      const resyncToasts = document.querySelector('#resync-toasts');

      const uiStateKey = 'diario-deutsch-ui-v1';

      let deck = null, fileHandle = null, directoryHandle = null, activeAudio = null, activeObjectUrl = '', showPhonetic = uiState.showPhonetic, revealed = false, pointerStart = null, resyncPanelOpen = false, resyncDirty = false, resyncConfirmOpen = false, resyncConfirmMode = '', resetConfirmOpen = false;
      let downloadState = { cards:[], completed:0, failed:[], running:false }, reviewTotal = 0;

      const toIso = date => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;

      const addDays = (date, days) => { const d = new Date(date + 'T12:00:00'); d.setDate(d.getDate() + days); return toIso(d); };
      const addMonths = (date, months) => { const d = new Date(date + 'T12:00:00'); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + months); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); return toIso(d); };

      const actionIcon = name => ({
        again: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"></path></svg>',
        play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z" fill="currentColor" stroke="none"></path></svg>',
        pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"></path></svg>',
        loading: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a8 8 0 1 1-7.2 4.5"></path></svg>',
        retry: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 1-2.35-5.65L20 8M20 3v5h-5"></path></svg>',
        known: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4.2 4.2L19 6.5"></path></svg>'
      }[name]);
      const syncIcon = name => ({
        perfect: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11v9H4v-9M7 11l5-7c.8 0 1.5.7 1.5 1.5V9H19c1 0 1.7.9 1.5 1.9l-1.2 7A2 2 0 0 1 17.3 20H7"></path></svg>',
        adjust: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M9 4v6M15 14v6"></path></svg>',
        unknown: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M9.7 9.2a2.4 2.4 0 1 1 3.8 2c-.9.65-1.5 1.08-1.5 2.3M12 17.4h.01"></path></svg>'
      }[name]);
      const waveformBars = [10,14,18,22,16,26,20,30,24,14,19,25,17,29,22,32,18,27,15,23,30,19,26,21,31,16,28,20,24,14,29,22,32,18,26,12,20,30,17,25,15,28,20,31,16,23,29,18,26,14,22,32,17,25,15,20].map((height, index) => `<rect x="${index * 6.8 + 1.7}" y="${(38 - height) / 2}" width="3.4" height="${height}" rx="1.7"></rect>`).join('');

      function parseMeta(line) {
        const meta = {};
        line.replace(/^\s*- Meta:\s*/, '').split(';').forEach(part => {
          const index = part.indexOf('=');
          if (index > 0) meta[part.slice(0, index).trim()] = part.slice(index + 1).trim();
        });
        return meta;
      }

      function parseDeck(text) {
        const lines = text.replace(/\r/g, '').split('\n');
        const progress = (text.match(/<!-- diario-deutsch-progresso: ([\s\S]*?) -->/) || [, 'modulo=Não definido; aula=Não definida; proximo=Registrar conteúdo'])[1].trim();
        const groups = [], cards = [];
        let date = null, group = null;
        for (let i = 0; i < lines.length; i++) {

          if (header) { date = header[1].split('/').reverse().join('-'); group = { date, cards: [] }; groups.push(group); continue; }

          if (!match || !date) continue;
          const meta = /^\s*- Meta:/.test(lines[i + 1] || '') ? parseMeta(lines[++i]) : {};
          const type = match[1].toLowerCase();
          const card = { type, number: Number(match[2]), front: match[3], back: match[4], created: meta.created || date, source: meta.source || 'Sem origem', id: meta.id || `${date}-${type}-${match[2]}`, stage: meta.stage || 'daily', daily: Number(meta.daily || 0), intervalMonths: Number(meta.intervalMonths || 2), next: meta.next || date, video: meta.video || '', start: meta.start || '', end: meta.end || '', audio: meta.audio || '', phonetic: meta.phonetic || '', wordTimes: meta.wordTimes || '', audioSync: meta.audioSync || '', resyncFeedback: meta.resyncFeedback || '', resyncStartHintMs: Number(meta.resyncStartHintMs || 0), resyncEndHintMs: Number(meta.resyncEndHintMs || 0) };

        }

        return { progress, groups, cards, audioBase: audioSource?.[1].trim() || '', audioRevision: audioSource?.[2].trim() || '' };
      }

      function serializeDeck(currentDeck) {
        const progressText = currentDeck.progress.split(';').map(item => item.trim()).filter(Boolean);
        const pretty = Object.fromEntries(progressText.map(item => { const [key, ...value] = item.split('='); return [key, value.join('=').trim()]; }));
        const groups = [...currentDeck.groups].sort((a,b) => a.date.localeCompare(b.date));
        let output = '# Anki Deutsch\n\nEste arquivo é a fonte única do seu baralho e do histórico de revisão. Importe-o no `anki.html`, revise os cartões e exporte/salve o arquivo atualizado ao terminar.\n\n## Progresso\n\n';
        output += `<!-- diario-deutsch-progresso: ${currentDeck.progress} -->\n`;
        if (currentDeck.audioBase && currentDeck.audioRevision) output += `<!-- diario-deutsch-audio-source: base=${currentDeck.audioBase}; revision=${currentDeck.audioRevision} -->\n`;
        output += '\n';
        output += `Você está em **${pretty.modulo || 'módulo não definido'} — ${pretty.aula || 'aula não definida'}**. Próximo passo: ${pretty.proximo || 'registrar conteúdo'}.\n\n## Cartões\n`;
        for (const group of groups) {
          if (!group.cards.length) continue;
          output += `\n# Date ${humanDate(group.date)}\n\n`;
          group.cards.sort((a,b) => a.number - b.number).forEach(card => {
            const label = card.type[0].toUpperCase() + card.type.slice(1);
            output += `- ${label} ${String(card.number).padStart(2,'0')}: ${card.front} | ${card.back}\n`;
            const media = [card.video && `video=${card.video}`, card.start && `start=${card.start}`, card.end && `end=${card.end}`, card.audio && `audio=${card.audio}`, card.phonetic && `phonetic=${card.phonetic}`, card.wordTimes && `wordTimes=${card.wordTimes}`, card.audioSync && `audioSync=${card.audioSync}`, card.resyncFeedback && `resyncFeedback=${card.resyncFeedback}`, card.resyncAnalysis && `resyncAnalysis=${card.resyncAnalysis}`, Number.isFinite(card.resyncStartHintMs) && card.resyncStartHintMs && `resyncStartHintMs=${card.resyncStartHintMs}`, Number.isFinite(card.resyncEndHintMs) && card.resyncEndHintMs && `resyncEndHintMs=${card.resyncEndHintMs}`].filter(Boolean);
            output += `  - Meta: id=${card.id}; type=${card.type}; source=${card.source}; created=${card.created}; stage=${card.stage}; daily=${card.daily}; intervalMonths=${card.intervalMonths}; next=${card.next}${media.length ? `; ${media.join('; ')}` : ''}\n`;
          });
        }
        return output + '\n';
      }

      const dueCards = () => deck.cards.filter(card => card.next <= isoToday()).sort((a,b) => a.next.localeCompare(b.next) || a.created.localeCompare(b.created));
      const currentDueCard = () => dueCards().find(card => card.id === uiState.activeCardId) || dueCards()[0];
      function showStatus() { const due = dueCards().length; statusEl.textContent = due ? '' : 'Nenhum cartão vencido. Continue amanhã ou importe outro baralho.'; saveButton.disabled = !deck; }
      function empty(message, title = 'Tudo revisado', resettable = false) {
        const reset = resettable ? `<div class="empty-actions"><button type="button" class="empty-reset" id="reset-deck" aria-label="Recomeçar todos os cartões" title="Recomeçar todos os cartões" aria-expanded="${String(resetConfirmOpen)}">${actionIcon('retry')}</button><div class="empty-reset-confirm${resetConfirmOpen ? '' : ' is-concealed'}" id="reset-confirm" role="group" aria-label="Confirmar reinício do baralho"><p>Recomeçar todos os cartões?</p><button type="button" id="reset-cancel">Cancelar</button><button type="button" class="confirm" id="reset-confirm-action">Recomeçar</button></div></div>` : '';
        deckEl.innerHTML = `<div class="empty"><h2>${esc(title)}</h2><p>${esc(message)}</p>${reset}</div>`;
      }
      function updatePhoneticToggle() {
        phoneticToggle.classList.toggle('active', showPhonetic);
        phoneticToggle.setAttribute('aria-pressed', String(showPhonetic));

        loop.classList.toggle('active', uiState.loop); loop.setAttribute('aria-pressed', String(uiState.loop));
        document.querySelectorAll('.audio-rate').forEach(button => button.classList.toggle('active', Number(button.dataset.rate) === uiState.playbackRate));
      }
      function setStage(reviewing) {
        importStage.hidden = reviewing; reviewStage.hidden = !reviewing; settingsToggle.hidden = !reviewing;
        document.body.classList.toggle('is-reviewing', reviewing);
        stepLabel.textContent = reviewing ? '' : '01 · Importação';
        if (!reviewing) { settingsPanel.hidden = true; settingsToggle.setAttribute('aria-expanded', 'false'); }
      }
      function queueProgress(card) {
        const cards = dueCards(), total = reviewTotal || cards.length, completed = Math.max(0, total - cards.length);
        return `${Math.min(total, completed + Math.max(0, cards.findIndex(item => item.id === card.id)) + 1)} / ${total}`;
      }
      const wordsOf = text => text.trim().split(/\s+/).filter(Boolean);
      function parseWordTimes(value, wordCount) {
        const times = String(value || '').split('|').filter(Boolean).map(item => {
          const match = item.trim().match(/^(\d+(?:\.\d+)?)-(\d+(?:\.\d+)?)$/);
          if (!match) return null;
          const start = Number(match[1]), end = Number(match[2]);
          return Number.isFinite(start) && Number.isFinite(end) && start >= 0 && end > start ? { start, end } : null;
        });
        return times.length === wordCount && times.every(Boolean) ? times : [];
      }
      function questionMarkup(card) {
        const words = wordsOf(card.front), sounds = wordsOf(card.phonetic), wordTimes = parseWordTimes(card.wordTimes, words.length);
        const pairs = words.map((word, index) => {
          const karaoke = wordTimes.length ? `<span class="karaoke-word" data-word-index="${index}">${esc(word)}</span>` : esc(word);
          const phonetic = card.phonetic && words.length === sounds.length ? `<span class="phonetic-word" ${showPhonetic ? '' : 'hidden'}>${esc(sounds[index])}</span>` : '';
          return `<span class="word-pair">${karaoke}${phonetic}</span>`;
        }).join('');
        return `<div class="question">${pairs}</div>`;
      }
      function stopAudio() { if (activeAudio) { activeAudio.pause(); activeAudio.currentTime = 0; activeAudio = null; } if (activeObjectUrl) { URL.revokeObjectURL(activeObjectUrl); activeObjectUrl = ''; } }
      function audioMarkup(card) {
        if (!card.audio) return '';
        const sourceUrl = audioUrl(card);
        return `<section class="audio-player"><audio id="card-audio" preload="metadata"${sourceUrl ? ` src="${esc(sourceUrl)}"` : ''}></audio></section>`;
      }
      function resyncHintsMarkup(card) {
        const startHint = Number.isFinite(card.resyncStartHintMs) ? card.resyncStartHintMs : 0, endHint = Number.isFinite(card.resyncEndHintMs) ? card.resyncEndHintMs : 0;
        const waveBounds = () => ({ start:Math.max(0, Math.min(36, 18 + (startHint / 500) * 18)), end:Math.max(64, Math.min(100, 82 + (endHint / 500) * 18)) });
        const bounds = waveBounds();
        const adjustment = (label, key, value) => {
          return `<div class="resync-hint"><span>${label}</span><div class="adjust-control"><button type="button" data-resync-hint="${key}" data-delta="-50" aria-label="Diminuir ${label} em 50 milissegundos">−</button><output class="adjust-value">${value > 0 ? '+' : ''}${value} ms</output><button type="button" data-resync-hint="${key}" data-delta="50" aria-label="Aumentar ${label} em 50 milissegundos">+</button></div></div>`;
        };
        const unknownConfirmation = resyncConfirmMode === 'unknown';
        const confirmationText = unknownConfirmation ? 'Análise aprofundada necessária' : 'Salvar ajustes de sync?';
        const confirmationAction = unknownConfirmation ? 'Confirmar' : 'Salvar';
        return `<div class="resync-hints${resyncPanelOpen ? '' : ' is-concealed'}" id="resync-hints" aria-hidden="${String(!resyncPanelOpen)}">${adjustment('Começo', 'start', startHint)}${adjustment('Fim', 'end', endHint)}<button type="button" class="resync-unknown" id="resync-unknown" aria-label="Marcar resync necessário sem indicar correção" title="Resync necessário">${syncIcon('unknown')}</button><button type="button" class="resync-save${resyncDirty ? ' pending' : ''}" id="resync-save" ${resyncDirty ? '' : 'disabled'} aria-label="Salvar ajustes de sincronismo" title="Salvar ajustes de sincronismo" aria-expanded="${String(resyncConfirmOpen)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l3 3v15H5zM8 3v6h8V3M8 21v-7h8v7"></path></svg></button><div class="clip-waveform" id="resync-waveform" aria-hidden="true" style="--clip-start:${bounds.start}%;--clip-end:${bounds.end}%"><svg class="wave-base" viewBox="0 0 380 38" preserveAspectRatio="none">${waveformBars}</svg><svg class="wave-fill" viewBox="0 0 380 38" preserveAspectRatio="none">${waveformBars}</svg></div><div class="resync-confirm${resyncConfirmOpen ? '' : ' is-concealed'}" id="resync-confirm" role="group" aria-label="${confirmationText}" aria-hidden="${String(!resyncConfirmOpen)}"><p>${confirmationText}</p><div class="resync-confirm-actions"><button type="button" id="resync-cancel">Cancelar</button><button type="button" class="confirm" id="resync-confirm-save">${confirmationAction}</button></div></div></div>`;
      }
      function showResyncToast(message, tone = 'success') {
        const toast = document.createElement('div');
        toast.className = `resync-toast${tone === 'error' ? ' error' : ''}`;
        toast.setAttribute('role', 'status');
        toast.textContent = message;
        resyncToasts.append(toast);
        setTimeout(() => {
          toast.classList.add('is-leaving');
          setTimeout(() => toast.remove(), 170);
        }, 5000);
      }
      function feedbackMarkup(card) {
        return `<div class="resync-feedback" aria-label="Feedback do sincronismo"><button type="button" class="${card.resyncFeedback === 'perfect-sync' ? 'active' : ''}" data-resync-feedback="perfect-sync" aria-label="Sincronismo perfeito" title="Sincronismo perfeito">${syncIcon('perfect')}</button><button type="button" class="adjust ${card.resyncFeedback === 'reajustar' ? 'active' : ''}" data-resync-feedback="reajustar" aria-label="${resyncPanelOpen ? 'Fechar ajuste de sincronismo' : 'Abrir ajuste de sincronismo'}" title="${resyncPanelOpen ? 'Fechar ajuste' : 'Ajustar sincronismo'}">${syncIcon('adjust')}</button></div>`;
      }
      function updateResyncUi(card) {
        const panel = document.querySelector('#resync-hints');
        if (panel) {
          panel.classList.toggle('is-concealed', !resyncPanelOpen);
          panel.classList.toggle('has-confirmation', resyncConfirmOpen);
          panel.setAttribute('aria-hidden', String(!resyncPanelOpen));
        }
        document.querySelectorAll('[data-resync-hint]').forEach(button => {
          const key = button.dataset.resyncHint === 'start' ? 'resyncStartHintMs' : 'resyncEndHintMs';
          const value = Number(card[key] || 0);
          const output = button.closest('.adjust-control')?.querySelector('output');
          if (output) output.textContent = `${value > 0 ? '+' : ''}${value} ms`;
        });
        const waveform = document.querySelector('#resync-waveform');
        if (waveform) {
          const start = Math.max(-500, Math.min(500, Number(card.resyncStartHintMs || 0)));
          const end = Math.max(-500, Math.min(500, Number(card.resyncEndHintMs || 0)));
          waveform.style.setProperty('--clip-start', `${18 + (start / 500) * 18}%`);
          waveform.style.setProperty('--clip-end', `${82 + (end / 500) * 18}%`);
        }
        const perfect = document.querySelector('[data-resync-feedback="perfect-sync"]');
        const adjust = document.querySelector('[data-resync-feedback="reajustar"]');
        const unknown = document.querySelector('#resync-unknown');
        perfect?.classList.toggle('active', card.resyncFeedback === 'perfect-sync');
        adjust?.classList.toggle('active', card.resyncFeedback === 'reajustar');
        adjust?.classList.toggle('needs-analysis', card.resyncFeedback === 'needs-analysis');
        unknown?.classList.toggle('active', card.resyncFeedback === 'needs-analysis');
        if (unknown) {
          unknown.setAttribute('aria-label', 'Marcar análise aprofundada necessária');
          unknown.title = 'Análise aprofundada necessária';
        }
        if (adjust) {
          const needsAnalysis = card.resyncFeedback === 'needs-analysis';
          adjust.setAttribute('aria-label', resyncPanelOpen ? 'Fechar ajuste de sincronismo' : (needsAnalysis ? 'Abrir análise aprofundada' : 'Abrir ajuste de sincronismo'));
          adjust.title = resyncPanelOpen ? 'Fechar ajuste' : (needsAnalysis ? 'Análise aprofundada necessária' : 'Ajustar sincronismo');
        }
        const save = document.querySelector('#resync-save');
        if (save) {
          save.disabled = !resyncDirty;
          save.classList.toggle('pending', resyncDirty);
          save.setAttribute('aria-expanded', String(resyncConfirmOpen));
        }
        const confirmation = document.querySelector('#resync-confirm');
        if (confirmation) {
          const unknownConfirmation = resyncConfirmMode === 'unknown';
          const message = unknownConfirmation ? 'Análise aprofundada necessária' : 'Salvar ajustes de sync?';
          confirmation.classList.toggle('is-concealed', !resyncConfirmOpen);
          confirmation.setAttribute('aria-label', message);
          confirmation.setAttribute('aria-hidden', String(!resyncConfirmOpen));
          const text = confirmation.querySelector('p');
          const action = confirmation.querySelector('#resync-confirm-save');
          if (text) text.textContent = message;
          if (action) action.textContent = unknownConfirmation ? 'Confirmar' : 'Salvar';
        }
      }
      function audioCaptionMarkup(card) {
        if (!card.audio || !parseWordTimes(card.wordTimes, wordsOf(card.front).length).length) return '';
        const source = card.video ? `<a href="${esc(card.video)}" target="_blank" rel="noreferrer">vídeo original</a>` : '';
        const range = card.start && card.end ? esc(`${card.start}–${card.end}`) : '';
        const detail = [range, source].filter(Boolean).join(' · ');
        return `<section class="audio-meta"><div class="audio-meta-head"><div class="audio-caption"><span><span class="sync-state">Karaoke sincronizado</span> - ${esc(card.audio)}</span><span>${detail}</span></div>${feedbackMarkup(card)}</div>${resyncHintsMarkup(card)}</section>`;
      }
      function setupAudioPlayer(card) {
        const audio = document.querySelector('#card-audio'); if (!audio) return;
        activeAudio = audio;
        const play = document.querySelector('#audio-play'), loop = document.querySelector('#audio-loop');
        audio.loop = uiState.loop; audio.playbackRate = uiState.playbackRate;
        loop.classList.toggle('active', audio.loop);
        document.querySelectorAll('.audio-rate').forEach(button => button.classList.toggle('active', Number(button.dataset.rate) === audio.playbackRate));
        const wordTimes = parseWordTimes(card.wordTimes, wordsOf(card.front).length);
        const karaokeWords = [...document.querySelectorAll('.karaoke-word')];
        let karaokeFrame = null;
        let ready = false, playWhenReady = false, failed = false;
        const updateKaraoke = () => {
          karaokeWords.forEach((word, index) => {
            const time = wordTimes[index];
            if (!time) return;
            const progress = Math.max(0, Math.min(1, (audio.currentTime - time.start) / (time.end - time.start)));
            word.style.setProperty('--karaoke-fill', `${(progress * 100).toFixed(1)}%`);
          });
        };
        const animateKaraoke = () => { updateKaraoke(); if (!audio.paused) karaokeFrame = requestAnimationFrame(animateKaraoke); };
        const startKaraoke = () => { if (!wordTimes.length) return; cancelAnimationFrame(karaokeFrame); animateKaraoke(); };
        const syncPlay = () => {
          if (failed) { play.innerHTML = actionIcon('retry'); play.disabled = false; play.setAttribute('aria-label', 'Tentar carregar áudio novamente'); play.title = 'Tentar novamente'; return; }
          if (!ready) { play.innerHTML = actionIcon('loading'); play.disabled = true; play.setAttribute('aria-busy', 'true'); play.setAttribute('aria-label', 'Carregando áudio'); return; }
          play.disabled = false; play.removeAttribute('aria-busy'); play.innerHTML = actionIcon(audio.paused ? 'play' : 'pause'); play.setAttribute('aria-label', audio.paused ? 'Tocar áudio' : 'Pausar áudio'); play.title = audio.paused ? 'Tocar' : 'Pausar';
        };
        const togglePlayback = async () => {
          if (failed) { failed = false; ready = false; syncPlay(); void setAudioSource(card, audio); return; }
          if (!ready) { playWhenReady = true; return; }
          try { if (audio.paused) await audio.play(); else audio.pause(); } catch (_) { statusEl.textContent = 'Não foi possível tocar este clip.'; }
          syncPlay();
        };
        play.addEventListener('click', event => { event.stopPropagation(); void togglePlayback(); });
        audio.addEventListener('canplay', async () => {
          if (audio !== activeAudio) return;
          ready = true; failed = false; syncPlay();
          if (playWhenReady) { playWhenReady = false; await togglePlayback(); }
        });
        audio.addEventListener('play', () => { syncPlay(); startKaraoke(); });
        audio.addEventListener('pause', () => { syncPlay(); cancelAnimationFrame(karaokeFrame); });
        audio.addEventListener('seeking', updateKaraoke);
        audio.addEventListener('timeupdate', updateKaraoke);
        updateKaraoke();
        audio.addEventListener('error', () => { if (audio !== activeAudio) return; failed = true; ready = false; playWhenReady = false; statusEl.textContent = 'Não foi possível carregar este clip. Toque para tentar novamente.'; syncPlay(); });
        void setAudioSource(card, audio).then(available => {
          if (audio !== activeAudio) return;
          if (!available) { failed = true; statusEl.textContent = 'Este card não possui fonte HTTPS de áudio.'; syncPlay(); return; }
          if (audio.readyState >= 3) { ready = true; syncPlay(); }
        });
        updatePhoneticToggle();
      }

      const dbRequest = request => new Promise((resolve, reject) => { request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error); });
      const transactionDone = transaction => new Promise((resolve, reject) => { transaction.oncomplete = () => resolve(); transaction.onerror = () => reject(transaction.error); transaction.onabort = () => reject(transaction.error); });
      function openFolderDatabase() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open('diario-deutsch', 2);
          request.onupgradeneeded = () => { if (!request.result.objectStoreNames.contains('settings')) request.result.createObjectStore('settings'); if (!request.result.objectStoreNames.contains('audio')) request.result.createObjectStore('audio'); };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }
      async function rememberDirectory(handle) {
        if (!('indexedDB' in window)) return;
        const database = await openFolderDatabase();
        const transaction = database.transaction('settings', 'readwrite');
        transaction.objectStore('settings').put(handle, 'last-directory');
        await transactionDone(transaction);
        database.close();
      }
      async function rememberedDirectory() {
        if (!('indexedDB' in window)) return null;
        const database = await openFolderDatabase();
        const transaction = database.transaction('settings', 'readonly');
        const handle = await dbRequest(transaction.objectStore('settings').get('last-directory'));
        database.close();
        return handle || null;
      }
      const audioCacheKey = card => `${deck?.audioBase || ''}|${deck?.audioRevision || ''}|${card.audio}`;
      const audioUrl = card => deck?.audioBase ? `${deck.audioBase.replace(/\/$/, '')}/${card.audio.replace(/^\//, '')}?v=${encodeURIComponent(deck.audioRevision)}` : '';
      async function cachedAudio(card) {
        if (!deck?.audioBase || !('indexedDB' in window)) return null;
        const database = await openFolderDatabase();
        const transaction = database.transaction('audio', 'readonly');
        const record = await dbRequest(transaction.objectStore('audio').get(audioCacheKey(card)));
        database.close();
        return record?.blob || null;
      }
      async function cacheAudio(card, blob) {
        const database = await openFolderDatabase();
        const transaction = database.transaction('audio', 'readwrite');
        transaction.objectStore('audio').put({ base:deck.audioBase, revision:deck.audioRevision, path:card.audio, blob }, audioCacheKey(card));
        await transactionDone(transaction); database.close();
      }
      async function setAudioSource(card, audio) {
        const remote = audioUrl(card);
        try {
          const blob = await cachedAudio(card);
          if (audio !== activeAudio) return false;
          if (blob) {
            activeObjectUrl = URL.createObjectURL(blob);
            audio.src = activeObjectUrl;
            audio.load();
            return true;
          }
          if (remote) {
            if (audio.src !== remote) { audio.src = remote; audio.load(); }
            return true;
          }
          return false;
        } catch (_) {
          if (!remote || audio !== activeAudio) return false;
          if (audio.src !== remote) { audio.src = remote; audio.load(); }
          return true;
        }
      }
      async function fetchAudioWithRetry(card, attempts = 3) {
        const url = audioUrl(card); if (!url) throw new Error('Fonte HTTPS não configurada.');
        let lastError;
        for (let attempt = 0; attempt < attempts; attempt++) {
          try { const response = await fetch(url); if (!response.ok) throw new Error(`HTTP ${response.status}`); const blob = await response.blob(); if (!blob.size) throw new Error('Arquivo vazio.'); return blob; }
          catch (error) { lastError = error; if (attempt < attempts - 1) await new Promise(resolve => setTimeout(resolve, 400 * 2 ** attempt)); }
        }
        throw lastError;
      }
      function renderDownloadState() {
        const state = downloadState;
        if (!state.cards.length) return;
        if (state.running) statusEl.textContent = 'Preparando clips de áudio para uso offline…';
        else if (state.failed.length) statusEl.textContent = `${state.failed.length} clip(s) não puderam ser baixados. Use configurações para tentar novamente.`;
        else if (deck) statusEl.textContent = '';
        downloadRetry.hidden = !state.failed.length || state.running;
        downloadRetry.textContent = `Tentar novamente (${state.failed.length})`;
      }
      async function startAudioDownloads(cards = deck?.cards.filter(card => card.audio) || []) {
        if (!deck?.audioBase || downloadState.running) return;
        const missing = [];
        for (const card of cards) if (!(await cachedAudio(card))) missing.push(card);
        downloadState = { cards:deck.cards.filter(card => card.audio), completed:deck.cards.filter(card => card.audio).length - missing.length, failed:[], running:true };
        renderDownloadState();
        const queue = [...missing];
        const worker = async () => { while (queue.length) { const card = queue.shift(); try { await cacheAudio(card, await fetchAudioWithRetry(card)); downloadState.completed++; } catch (_) { downloadState.failed.push(card); } renderDownloadState(); } };
        await Promise.all(Array.from({ length:Math.min(3, queue.length) }, worker));
        downloadState.running = false; renderDownloadState();
      }
      async function permissionForDirectory(handle, ask = false) {
        const options = { mode: 'readwrite' };
        let permission = await handle.queryPermission(options);
        if (permission !== 'granted' && ask) permission = await handle.requestPermission(options);
        return permission === 'granted';
      }
      function renderDeckList(entries) {
        deckList.innerHTML = '';
        deckList.hidden = !entries.length;
        for (const entry of entries) {
          const button = document.createElement('button');
          button.className = 'deck-option';
          button.innerHTML = `<span>${esc(entry.name)}</span><small>Abrir</small>`;
          button.addEventListener('click', async () => {
            try { const file = await entry.handle.getFile(); fileHandle = entry.handle; loadText(await file.text(), entry.name); }
            catch (_) { statusEl.textContent = 'Não foi possível abrir este anki.md.'; }
          });
          deckList.append(button);
        }
      }
      async function listDirectoryDecks() {
        if (!directoryHandle) return;
        const entries = [];
        for await (const [name, handle] of directoryHandle.entries()) {
          if (handle.kind === 'file' && name.toLowerCase() === 'anki.md') entries.push({ name, handle });
        }
        renderDeckList(entries);
        folderNote.hidden = false;
        statusEl.textContent = entries.length ? `${entries.length} anki.md encontrado nesta pasta.` : 'Nenhum anki.md foi encontrado nesta pasta.';
      }
      async function chooseDirectory() {
        try {
          directoryHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
          await rememberDirectory(directoryHandle);
          resumeButton.hidden = true;
          await listDirectoryDecks();
        } catch (error) {
          if (error.name !== 'AbortError') statusEl.textContent = 'Não foi possível acessar a pasta.';
        }
      }
      async function resumeDirectory() {
        if (!directoryHandle) return;
        try {
          if (await permissionForDirectory(directoryHandle, true)) { resumeButton.hidden = true; await listDirectoryDecks(); }
          else statusEl.textContent = 'A permissão para essa pasta não foi concedida.';
        } catch (_) { statusEl.textContent = 'Não foi possível retomar a pasta. Escolha-a novamente.'; }
      }
      async function restoreDirectory() {
        try {
          directoryHandle = await rememberedDirectory();
          if (!directoryHandle) return;
          folderNote.hidden = false;
          if (await permissionForDirectory(directoryHandle)) await listDirectoryDecks();
          else { resumeButton.hidden = false; statusEl.textContent = 'A última pasta foi lembrada. Clique em “Retomar pasta” para autorizar o acesso.'; }
        } catch (_) { directoryHandle = null; }
      }

      function render(keepResyncPanel = false) {
        stopAudio();
        if (!keepResyncPanel) { resyncPanelOpen = false; resyncConfirmOpen = false; resyncConfirmMode = ''; }
        if (!deck) { setStage(false); return; }
        setStage(true);
        const card = currentDueCard(); showStatus();
        if (!card) {
          empty('O seu próximo cartão aparecerá na data programada. Salve o anki.md antes de sair.', 'Tudo revisado', true);
          document.querySelector('#reset-deck')?.addEventListener('click', () => { resetConfirmOpen = true; render(); });
          document.querySelector('#reset-cancel')?.addEventListener('click', () => { resetConfirmOpen = false; render(); });
          document.querySelector('#reset-confirm-action')?.addEventListener('click', resetDeck);
          return;
        }
        resetConfirmOpen = false;
        uiState.activeCardId = card.id; writeUiState();
        revealed = false;
        const label = card.type[0].toUpperCase() + card.type.slice(1);
        const cardStatus = card.stage === 'daily' ? `diário ${card.daily}/30` : `mensal ${card.intervalMonths} meses`;
        deckEl.innerHTML = `<article class="study-card" id="card"><div class="study-main"><div class="card-top"><button type="button" class="reveal" id="reveal" aria-label="Mostrar tradução" aria-expanded="false" title="Mostrar tradução">◉</button><div class="tag">${esc(label)} · ${cardStatus}</div></div>${questionMarkup(card)}<div class="answer is-concealed" id="answer" aria-hidden="true">${esc(card.back)}</div></div><div class="study-footer">${audioMarkup(card)}<div class="actions"><button type="button" class="again" id="again" aria-label="Repetir cartão" title="Repetir">${actionIcon('again')}</button><button type="button" id="audio-play" disabled aria-busy="true" aria-label="Carregando áudio" title="Carregando áudio">${actionIcon('loading')}</button><button type="button" class="known" id="known" aria-label="Marcar como lembro" title="Lembro">${actionIcon('known')}</button></div></div></article>${audioCaptionMarkup(card)}`;
        const cardEl = document.querySelector('#card');
        document.querySelector('#reveal').addEventListener('click', reveal);
        document.querySelector('#again').addEventListener('click', () => grade(false));
        document.querySelector('#known').addEventListener('click', () => grade(true));
        cardEl.querySelectorAll('button, a, input, label').forEach(control => {
          control.addEventListener('pointerdown', event => event.stopPropagation());
          control.addEventListener('pointerup', event => event.stopPropagation());
        });
        document.querySelectorAll('[data-resync-feedback]').forEach(button => button.addEventListener('click', () => {
          const feedback = button.dataset.resyncFeedback;
          if (feedback === 'perfect-sync') {
            card.resyncFeedback = 'perfect-sync';
            card.resyncAnalysis = '';
            card.resyncStartHintMs = 0;
            card.resyncEndHintMs = 0;
            resyncPanelOpen = false;
            resyncDirty = true;
            resyncConfirmOpen = false;
            resyncConfirmMode = '';
            updateResyncUi(card);
            showResyncToast('Sync perfeito!');
            return;
          }
          if (feedback === 'reajustar' && ['reajustar', 'needs-analysis'].includes(card.resyncFeedback)) {
            resyncPanelOpen = !resyncPanelOpen;
            resyncConfirmOpen = false;
            resyncConfirmMode = '';
            updateResyncUi(card);
            return;
          }
          card.resyncFeedback = feedback;
          if (feedback === 'reajustar') {
            card.resyncAnalysis = '';
            card.resyncStartHintMs = Number.isFinite(card.resyncStartHintMs) ? card.resyncStartHintMs : 0;
            card.resyncEndHintMs = Number.isFinite(card.resyncEndHintMs) ? card.resyncEndHintMs : 0;
            resyncPanelOpen = true;
          } else resyncPanelOpen = false;
          resyncDirty = true;
          resyncConfirmOpen = false;
          resyncConfirmMode = '';
          updateResyncUi(card);
        }));
        document.querySelectorAll('[data-resync-hint]').forEach(button => button.addEventListener('click', () => {
          const key = button.dataset.resyncHint === 'start' ? 'resyncStartHintMs' : 'resyncEndHintMs';
          if (card.resyncFeedback === 'needs-analysis') {
            card.resyncFeedback = 'reajustar';
            card.resyncAnalysis = '';
          }
          card[key] = Math.max(-500, Math.min(500, Number(card[key] || 0) + Number(button.dataset.delta)));
          resyncDirty = true;
          resyncConfirmOpen = false;
          resyncConfirmMode = '';
          updateResyncUi(card);
        }));
        document.querySelector('#resync-save')?.addEventListener('click', () => {
          if (!resyncDirty) return;
          resyncConfirmMode = 'save';
          resyncConfirmOpen = true;
          updateResyncUi(card);
        });
        document.querySelector('#resync-unknown')?.addEventListener('click', () => {
          resyncPanelOpen = true;
          resyncConfirmMode = 'unknown';
          resyncConfirmOpen = true;
          updateResyncUi(card);
        });
        document.querySelector('#resync-cancel')?.addEventListener('click', () => {
          resyncConfirmOpen = false;
          resyncConfirmMode = '';
          updateResyncUi(card);
        });
        document.querySelector('#resync-confirm-save')?.addEventListener('click', async () => {
          const isUnknownResync = resyncConfirmMode === 'unknown';
          if (isUnknownResync) {
            card.resyncFeedback = 'needs-analysis';
            card.resyncAnalysis = '';
            card.resyncStartHintMs = 0;
            card.resyncEndHintMs = 0;
            resyncDirty = true;
            updateResyncUi(card);
          }
          const result = await saveDeck();
          if (result === 'failed') { showResyncToast('Não foi possível salvar. Tente novamente.', 'error'); return; }
          resyncDirty = false;
          resyncConfirmOpen = false;
          resyncConfirmMode = '';
          updateResyncUi(card);
          showResyncToast(result === 'written' ? (isUnknownResync ? 'Análise aprofundada necessária salva no anki.md.' : 'Resync salvo no anki.md.') : 'anki.md atualizado e baixado.');
        });
        updateResyncUi(card);
        setupAudioPlayer(card);
        cardEl.addEventListener('pointerdown', event => {
          if (event.target.closest('button, a, input, label')) { pointerStart = null; return; }
          pointerStart = { x:event.clientX, y:event.clientY }; cardEl.setPointerCapture(event.pointerId);
        });
        cardEl.addEventListener('pointerup', event => { if (!pointerStart) return; const dx = event.clientX - pointerStart.x; pointerStart = null; if (Math.abs(dx) > 95) grade(dx > 0); });
      }
      function reveal() {
        const answer = document.querySelector('#answer'), button = document.querySelector('#reveal');
        if (!answer || !button) return;
        const concealed = answer.classList.toggle('is-concealed');
        revealed = !concealed;
        answer.setAttribute('aria-hidden', String(concealed));
        button.textContent = revealed ? '⊘' : '◉';
        button.setAttribute('aria-label', revealed ? 'Ocultar tradução' : 'Mostrar tradução');
        button.setAttribute('aria-expanded', String(revealed));
      }
      function grade(known) {
        const card = currentDueCard(); if (!card) return;
        stopAudio();
        const today = isoToday();
        if (known) {
          if (card.stage === 'daily') {
            card.daily += 1;
            if (card.daily >= 30) { card.stage = 'monthly'; card.intervalMonths = 2; card.next = addMonths(today, 2); }
            else card.next = addDays(today, 1);
          } else { card.intervalMonths = Math.max(2, card.intervalMonths || 2) + 1; card.next = addMonths(today, card.intervalMonths); }
        } else { card.stage = 'daily'; card.daily = 0; card.intervalMonths = 2; card.next = addDays(today, 1); }
        const cardEl = document.querySelector('#card');
        uiState.activeCardId = ''; writeUiState();
        if (cardEl) { cardEl.classList.add(known ? 'swipe-right' : 'swipe-left'); setTimeout(render, 230); } else render();
      }
      function resetDeck() {
        if (!deck) return;
        const today = isoToday();
        deck.cards.forEach(card => { card.stage = 'daily'; card.daily = 0; card.intervalMonths = 2; card.next = today; });
        reviewTotal = deck.cards.length;
        resetConfirmOpen = false;
        uiState.activeCardId = '';
        writeUiState();
        render();
      }
      function loadText(text, name = 'anki.md') { try { deck = parseDeck(text); resyncDirty = false; resyncConfirmOpen = false; resyncConfirmMode = ''; resetConfirmOpen = false; if (!deck.cards.length) { setStage(true); showStatus(); empty('Ainda não há cartões. Peça à skill Diário Deutsch para registrar frases, palavras ou gramática.', 'Baralho vazio'); return; } reviewTotal = dueCards().length; statusEl.textContent = `${name} importado.`; render(); void startAudioDownloads(); } catch (error) { deck = null; setStage(false); statusEl.textContent = 'Não foi possível ler este arquivo.'; } }
      async function openWithPicker() { try { [fileHandle] = await window.showOpenFilePicker({ types:[{ description:'Markdown', accept:{ 'text/markdown':['.md'], 'text/plain':['.md'] } }] }); const file = await fileHandle.getFile(); loadText(await file.text(), file.name); } catch (error) { if (error.name !== 'AbortError') statusEl.textContent = 'Não foi possível abrir o arquivo.'; } }
      async function saveDeck() { if (!deck) return 'failed'; const contents = serializeDeck(deck); try { if (fileHandle?.createWritable) { const writable = await fileHandle.createWritable(); await writable.write(contents); await writable.close(); statusEl.textContent = 'anki.md salvo com o histórico atualizado.'; if (directoryHandle) await listDirectoryDecks(); return 'written'; } } catch (_) { statusEl.textContent = 'Não foi possível gravar diretamente; o download foi preparado.'; }
        const url = URL.createObjectURL(new Blob([contents], {type:'text/markdown;charset=utf-8'})); const link = Object.assign(document.createElement('a'), {href:url, download:'anki.md'}); link.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); return 'downloaded'; }
      function bindDropZone() { const zone = document.querySelector('#drop-zone'); if (!zone) return; ['dragenter','dragover'].forEach(type => zone.addEventListener(type, event => { event.preventDefault(); zone.classList.add('drag'); })); ['dragleave','drop'].forEach(type => zone.addEventListener(type, event => { event.preventDefault(); zone.classList.remove('drag'); })); zone.addEventListener('drop', event => { const file = event.dataTransfer.files[0]; if (file) file.text().then(text => loadText(text, file.name)); }); }
      fileInput.addEventListener('change', event => { const file = event.target.files[0]; if (file) { fileHandle = null; file.text().then(text => loadText(text, file.name)); } });
      saveButton.addEventListener('click', async () => { const result = await saveDeck(); if (result !== 'failed') { resyncDirty = false; resyncConfirmOpen = false; resyncConfirmMode = ''; const card = currentDueCard(); if (card) updateResyncUi(card); } });
      downloadRetry.addEventListener('click', () => { const failed = [...downloadState.failed]; downloadState.failed = []; void startAudioDownloads(failed); });
      phoneticToggle.addEventListener('click', () => { showPhonetic = !showPhonetic; uiState.showPhonetic = showPhonetic; writeUiState(); render(); });
      document.querySelector('#audio-loop').addEventListener('click', () => { uiState.loop = !uiState.loop; if (activeAudio) activeAudio.loop = uiState.loop; writeUiState(); updatePhoneticToggle(); });
      document.querySelectorAll('.audio-rate').forEach(button => button.addEventListener('click', () => { uiState.playbackRate = Number(button.dataset.rate); if (activeAudio) activeAudio.playbackRate = uiState.playbackRate; writeUiState(); updatePhoneticToggle(); }));
      settingsToggle.addEventListener('click', () => { settingsPanel.hidden = !settingsPanel.hidden; settingsToggle.setAttribute('aria-expanded', String(!settingsPanel.hidden)); });
      changeDeck.addEventListener('click', () => { stopAudio(); deck = null; fileHandle = null; resyncDirty = false; resyncConfirmOpen = false; resyncConfirmMode = ''; resetConfirmOpen = false; render(); });
      updatePhoneticToggle();
      if ('showOpenFilePicker' in window) { openButton.hidden = false; openButton.addEventListener('click', openWithPicker); }
      if ('showDirectoryPicker' in window) { folderButton.hidden = false; folderButton.addEventListener('click', chooseDirectory); resumeButton.addEventListener('click', resumeDirectory); restoreDirectory(); }
      window.addEventListener('keydown', event => { if (!deck || ['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return; if (event.key === 'ArrowRight') { event.preventDefault(); grade(true); } if (event.key === 'ArrowLeft') { event.preventDefault(); grade(false); } if (event.key === ' ' || event.key === 'Enter') { event.preventDefault(); reveal(); } });
      bindDropZone();
    })();
  </script>
